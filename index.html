<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aysel's Digital Space</title>
    <style>
        body { 
            background-color: #0f172a; /* Sleek, dark tech background */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .card { 
            background: #1e293b; /* Darker grey-blue for the card */
            padding: 35px; 
            width: 320px; 
            text-align: center;
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155; /* Subtle border to define the card */
            animation: fadeIn 0.8s ease-out;
        }
        
        h1 { 
            color: #38bdf8; /* Bright tech-blue/cyan */
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #94a3b8; /* Soft grey for readable text */
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Modernized Button */
        button {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        /* Interactive Hover Effects */
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Simple Fade-in Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello, I'm Aysel! 👋</h1>
        <p>I am a passionate learner exploring the world of coding and technology. Welcome to my digital space!</p>
        <a href="mailto:ayselqedirova920@gmail.com" style="text-decoration: none;>
            <button>Contact Me</button>
            </a>
    </div>

</body>
</html>
